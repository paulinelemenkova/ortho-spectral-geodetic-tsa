[project]
name = "ortho-spectral-geodetic-tsa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
sar = ["asf_search>=7", "hyp3_sdk>=6", "mintpy>=1.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
ignore_missing_imports = true
